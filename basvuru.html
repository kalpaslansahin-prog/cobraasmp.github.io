<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CobraSMP - Başvuru Formu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="form-body">

    <div class="form-container">
        <h2>🐍 CobraSMP Başvuru Formu</h2>
        <p>Lütfen ilgili konuyu seçip detaylıca doldur.</p>

        <form id="basvuruForm" onsubmit="formGonder(event)">
            
            <div class="input-group">
                <label for="username">Minecraft Kullanıcı Adın (IGN):</label>
                <input type="text" id="username" placeholder="Örn: OPRS666" required>
            </div>

            <div class="input-group">
                <label for="discord">Discord Kullanıcı Adın:</label>
                <input type="text" id="discord" placeholder="Örn: kullanici#0000" required>
            </div>

            <!-- Konu / Kategori Seçimi -->
            <div class="input-group">
                <label for="konu">Başvuru Konusu / Kategorisi:</label>
                <select id="konu" required>
                    <option value="" disabled selected>-- Lütfen Konu Seçin --</option>
                    <option value="Yetkili Başvurusu">🛡️ Yetkili / Kadro Başvurusu</option>
                    <option value="Eşya Yardımı">📦 Eşya Yardımı & Kayıp Talebi</option>
                    <option value="Oyuncu Şikayeti">🚨 Oyuncu / Şikayet Bildirimi</option>
                    <option value="Bug Bildirimi">🐛 Bug / Hata Bildirimi</option>
                    <option value="Genel Öneri">💡 Genel Öneri & Soru</option>
                </select>
            </div>

            <div class="input-group">
                <label for="mesaj">Açıklama / Detay:</label>
                <textarea id="mesaj" rows="5" placeholder="Talebini detaylıca açıkla..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Başvuruyu Gönder</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
