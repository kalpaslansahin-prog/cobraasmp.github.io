<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Başvuru - CobraaSMP</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 600px; margin: 0 auto; }
        label { display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 20px; padding: 10px; background: green; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>Başvuru</h1>
        <p>Sunucumuza katılmak için başvurunuzu yapın.</p>
        <a href="index.html">Ana Sayfa</a>
    </header>
    <form action="#" method="post" onsubmit="alert('Başvurunuz gönderildi! Teşekkür ederiz.'); return false;">
        <label for="name">İsim:</label>
        <input type="text" id="name" name="name" required>

        <label for="age">Yaş:</label>
        <input type="number" id="age" name="age" required>

        <label for="minecraft_username">Minecraft Kullanıcı Adı:</label>
        <input type="text" id="minecraft_username" name="minecraft_username" required>

        <label for="experience">Deneyim:</label>
        <textarea id="experience" name="experience" rows="3" placeholder="Minecraft deneyiminizi anlatın"></textarea>

        <label for="reason">Neden katılmak istiyorsunuz?</label>
        <textarea id="reason" name="reason" rows="3" required></textarea>

        <button type="submit">Başvur</button>
    </form>
</body>
</html>
