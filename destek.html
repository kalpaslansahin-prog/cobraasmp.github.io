<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destek - CobraaSMP</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 600px; margin: 0 auto; }
        label { display: block; margin-top: 10px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
        button { margin-top: 20px; padding: 10px; background: blue; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>Destek</h1>
        <p>Herhangi bir sorun yaşarsanız, lütfen aşağıdaki formu doldurun.</p>
        <a href="index.html">Ana Sayfa</a>
    </header>
    <form action="#" method="post" onsubmit="alert('Mesajınız gönderildi! En kısa sürede yanıt vereceğiz.'); return false;">
        <label for="name">İsim:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">E-posta:</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Konu:</label>
        <input type="text" id="subject" name="subject" required>

        <label for="message">Mesaj:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Gönder</button>
    </form>
</body>
</html>
